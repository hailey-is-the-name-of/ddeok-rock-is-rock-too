<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>BTC / KRW</title>
<style>
:root{
  --bg:#071017;
  --bg2:#09131b;
  --panel:#0b151e;
  --line:#1a242e;
  --muted:#8f98a3;
  --text:#f1f4f7;
  --red:#ff4d4f;
  --green:#34c66b;
  --purple:#9e72ff;
  --orange:#ff8a2a;
  --blue:#5aa4ff;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%;background:#000}
html,body{margin:0;background:#000;color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR",Roboto,Arial,sans-serif}
body{min-height:100svh;display:flex;justify-content:center;align-items:flex-start;overflow:hidden}
#phone{
  width:min(100vw,46.1538svh);
  height:min(100svh,216.6667vw);
  min-width:300px;
  aspect-ratio:426/923;
  background:linear-gradient(180deg,#081119,#060d13 65%,#050a0f);
  overflow:hidden;
  position:relative;
  display:flex;
  flex-direction:column;
  border-left:1px solid #101820;
  border-right:1px solid #101820;
  container-type:inline-size;
  font-variant-numeric:tabular-nums;
}
.status{
  height:5.15%;flex:0 0 5.15%;
  display:flex;align-items:center;justify-content:space-between;
  padding:0 5.2% 0 8.1%;
  font-weight:700;font-size:4.1cqw;
  letter-spacing:-.04cqw;
}
.status .right{display:flex;gap:2.1cqw;align-items:center}
.signal{display:flex;gap:.45cqw;align-items:flex-end;height:3.2cqw}
.signal i{width:.72cqw;background:#fff;border-radius:.5cqw;display:block}
.signal i:nth-child(1){height:1.05cqw}.signal i:nth-child(2){height:1.7cqw}.signal i:nth-child(3){height:2.45cqw}.signal i:nth-child(4){height:3.2cqw}
.wifi{width:4.5cqw;height:3.2cqw;border-top:.72cqw solid #fff;border-radius:50%;position:relative}
.wifi:after{content:"";position:absolute;width:1.15cqw;height:1.15cqw;background:#fff;border-radius:50%;left:50%;bottom:-.1cqw;transform:translateX(-50%)}
.battery{height:3.8cqw;min-width:7.5cqw;border:.35cqw solid #d7dce0;border-radius:1cqw;padding:0 .7cqw;display:flex;align-items:center;justify-content:center;font-size:2.4cqw;font-weight:800;color:#0b1117;background:#fff}
.navbar{
  height:5.64%;flex:0 0 5.64%;border-bottom:1px solid var(--line);
  display:grid;grid-template-columns:1fr 2fr 1fr;align-items:center;padding:0 3.3%;
}
.back{position:relative;width:5.2cqw;height:5.2cqw;color:#d7dde2}
.back:before{content:"";position:absolute;width:3.7cqw;height:3.7cqw;left:.8cqw;top:.7cqw;border-left:.55cqw solid currentColor;border-bottom:.55cqw solid currentColor;transform:rotate(45deg)}
.back:after{content:"";position:absolute;width:5.3cqw;height:.55cqw;left:.4cqw;top:2.45cqw;background:currentColor;border-radius:1cqw}
.pair{text-align:center;font-size:4.15cqw;font-weight:620;letter-spacing:-.06cqw}
.pair small{display:inline-block;font-size:.72em;color:#a7aeb7;margin-left:1.2cqw;transform:translateY(-.2cqw)}
.icons{display:flex;align-items:center;justify-content:flex-end;gap:4.5cqw;color:#cfd6dd;font-size:6.4cqw;line-height:1;white-space:nowrap}
.icons .kebab{font-size:6cqw;transform:translateY(-.25cqw)}
.hero{
  height:12.13%;flex:0 0 12.13%;
  display:grid;grid-template-columns:1.55fr 1.08fr;
  padding:5.8% 3.8% 2.4% 3.2%;
  border-bottom:1px solid var(--line);
}
.priceBox{min-width:0}
#price{
  font-size:6.95cqw;font-weight:520;letter-spacing:-.14cqw;line-height:1;
  color:#d9dee4;
}
.krw{color:#7f8790;font-size:2.75cqw;margin-top:1.7cqw;line-height:1}
.change{font-size:3.25cqw;color:var(--red);margin-top:2.1cqw;display:flex;gap:2.05cqw;align-items:center;line-height:1}
.sparkWrap{position:absolute;left:42.5%;top:17.1%;width:16.8%;height:3.1%;margin:0}
.stats{display:grid;grid-template-columns:1fr auto;row-gap:1.95cqw;column-gap:1.5cqw;align-content:start;font-size:2.42cqw;line-height:1.12}
.stats .k{color:#a3abb4}.stats .v{text-align:right;white-space:nowrap}
.red{color:var(--red)}.blue{color:var(--blue)}
.tabs{
  height:5.58%;flex:0 0 5.58%;display:grid;grid-template-columns:repeat(5,1fr);border-bottom:1px solid var(--line);align-items:end
}
.tab{height:100%;display:flex;align-items:center;justify-content:center;color:#9299a2;font-size:3.65cqw;font-weight:520;position:relative}
.tab.active{color:var(--purple);font-weight:700}
.tab.active:after{content:"";position:absolute;left:10%;right:10%;bottom:0;height:.72cqw;background:var(--purple);border-radius:1cqw 1cqw 0 0}
.controls{
  height:5.09%;flex:0 0 5.09%;display:flex;align-items:center;justify-content:space-between;padding:0 3.5%;
}
.maBox{border:1px solid #202a34;border-radius:1.8cqw;height:7.15cqw;display:flex;align-items:center;padding:0 2cqw;gap:2.3cqw;background:#09121a}
.maBox b{font-size:2.65cqw;color:#d8dde2;font-weight:500;white-space:nowrap}
.legend{display:flex;gap:1.2cqw;font-size:2.55cqw;color:#aab2bb;white-space:nowrap}
.legend span:before{content:"";width:1.45cqw;height:1.45cqw;border-radius:50%;display:inline-block;margin-right:.6cqw}
.l5:before{background:#33c86c}.l20:before{background:#ff454d}.l60:before{background:#ff8a25}.l120:before{background:#9b6df4}
.chartHeadBtns{display:flex;gap:2.6cqw}
.squareBtn{width:7.5cqw;height:7.5cqw;border-radius:1.8cqw;border:1px solid #27313b;display:grid;place-items:center;color:#b8c0c8;font-size:4cqw;background:#0a131b}
.chart{
  height:47.29%;flex:0 0 47.29%;
  position:relative;
  border-top:1px solid #111a22;
  border-bottom:1px solid #1b252f;
  background:
    linear-gradient(#101820 1px,transparent 1px) 0 16.6%/100% 16.6%,
    linear-gradient(90deg,#101820 1px,transparent 1px) 14% 0/21% 100%;
}
#chartCanvas,#sparkCanvas{width:100%;height:100%;display:block}
#chartCanvas{position:absolute;inset:0}
.priceTag{
  position:absolute;right:0;top:34%;
  background:var(--red);color:#fff;padding:5px 7px;border-radius:3px 0 0 3px;
  font-size:2.48cqw;font-weight:500;transform:translateY(-50%);pointer-events:none
}
.priceTag:before{
  content:"";position:absolute;right:100%;top:50%;width:100vw;border-top:1px dashed var(--red);opacity:.8
}
.volLabel{position:absolute;left:2.2%;bottom:22.4%;font-size:2.43cqw;color:#bcc3ca}
.timeAxis{position:absolute;left:0;right:0;bottom:0;height:8.1%;border-top:1px solid #111922;display:flex;justify-content:space-around;align-items:center;font-size:2.32cqw;color:#9ba3ad;padding-left:2%}
.modeRow{
  height:8.17%;flex:0 0 8.17%;display:flex;align-items:center;justify-content:space-between;padding:0 3.5%;
}
.periods{display:flex;gap:.9cqw;align-items:center;flex:1;min-width:0}
.period{padding:2.4cqw 1.45cqw;border-radius:1.6cqw;color:#aeb5bd;font-size:3.15cqw;white-space:nowrap}
.period.active{padding-inline:2.4cqw;background:#17152d;color:#b69aff;font-weight:700}
.candleIcon{display:flex;gap:0}
.candleIcon div{width:9.85cqw;height:9cqw;border:1px solid #262f39;display:grid;place-items:center;color:#aeb6bf;font-size:4.2cqw}
.candleIcon div:first-child{border-radius:1.8cqw 0 0 1.8cqw}.candleIcon div:last-child{border-radius:0 1.8cqw 1.8cqw 0}
.candleIcon .active{color:var(--purple);background:#17152d}
.actions{
  height:7.7%;flex:0 0 7.7%;display:grid;grid-template-columns:1fr 1fr;gap:3cqw;padding:1.2% 3.5% 2.9%;
}
.action{
  border:0;border-radius:1.9cqw;color:#fff;font-size:4.12cqw;font-weight:720;letter-spacing:.02cqw;
}
.buy{background:linear-gradient(90deg,#2fc46a,#2ebc64)}
.sell{background:linear-gradient(90deg,#e34343,#f04848)}
.homebar{position:absolute;bottom:1.55%;left:32.3%;right:32.3%;height:1.2cqw;background:#fff;border-radius:2cqw}
.demoNote{
  display:none
}
@media (max-aspect-ratio:9/19){#phone{width:100vw;height:100svh;aspect-ratio:auto}.chart{min-height:36%}}
</style>
</head>
<body>
<div id="phone">
  <div class="status">
    <span>9:41</span>
    <span class="right"><span class="signal"><i></i><i></i><i></i><i></i></span><span class="wifi"></span><span class="battery">87</span></span>
  </div>

  <div class="navbar">
    <div class="back">‹</div>
    <div class="pair">BTC / KRW <small>⌄</small></div>
    <div class="icons"><span>☆</span><span class="kebab">⋮</span></div>
  </div>

  <section class="hero">
    <div class="priceBox">
      <div id="price">107,845,000</div>
      <div class="krw">KRW</div>
      <div class="change"><span id="delta">-152,000</span><span>▼</span><span id="pct">-0.14%</span></div>
      <div class="sparkWrap"><canvas id="sparkCanvas"></canvas></div>
    </div>
    <div class="stats">
      <div class="k">고가</div><div class="v red" id="high">108,250,000</div>
      <div class="k">저가</div><div class="v blue" id="low">106,920,000</div>
      <div class="k">거래량 (BTC)</div><div class="v" id="volume">1,128.35</div>
      <div class="k">거래대금 (KRW)</div><div class="v" id="turnover">121,210,482,000</div>
    </div>
  </section>

  <div class="tabs">
    <div class="tab active">차트</div><div class="tab">주문</div><div class="tab">호가</div><div class="tab">시세</div><div class="tab">정보</div>
  </div>

  <div class="controls">
    <div class="maBox"><b>이동평균선</b><div class="legend"><span class="l5">MA 5</span><span class="l20">20</span><span class="l60">60</span><span class="l120">120</span></div></div>
    <div class="chartHeadBtns"><div class="squareBtn">↗</div><div class="squareBtn">⚙</div></div>
  </div>

  <section class="chart">
    <canvas id="chartCanvas"></canvas>
    <div class="priceTag" id="priceTag">107,845,000</div>
    <div class="volLabel">체결량 (BTC)</div>
    <div class="timeAxis"><span id="tickTime0">--:--:--</span><span id="tickTime1">--:--:--</span><span id="tickTime2">--:--:--</span><span id="tickTime3">--:--:--</span><span id="tickTime4">--:--:--</span></div>
  </section>

  <div class="modeRow">
    <div class="periods"><div class="period active">틱⌄</div><div class="period">1분</div><div class="period">5분</div><div class="period">15분</div><div class="period">1시간</div><div class="period">4시간</div></div>
    <div class="candleIcon"><div class="active">⌁</div><div>♮</div></div>
  </div>

  <div class="actions">
    <button class="action buy" type="button" id="buyBtn">매수</button>
    <button class="action sell" type="button" id="sellBtn">매도</button>
  </div>
  <div class="demoNote" id="demoNote">60초 실시간 틱 시뮬레이션</div>
  <div class="homebar"></div>
</div>

<script>
(() => {
  const root=document.getElementById('phone');
  root.dataset.ready='rolling-tick-v2';

  const START=107845000;
  const TARGET=Math.round(START*.80);
  const DURATION=60000;
  const VISIBLE=200;
  const fmt=n=>Math.round(n).toLocaleString('ko-KR');
  const deterministic=i=>{
    const x=Math.sin(i*12.9898)*43758.5453;
    return x-Math.floor(x);
  };
  const smooth=(a,b,u)=>a+(b-a)*(u*u*(3-2*u));

  function levelFromAnchors(t,anchors){
    for(let i=1;i<anchors.length;i++){
      const a=anchors[i-1],b=anchors[i];
      if(t<=b[0])return smooth(a[1],b[1],(t-a[0])/(b[0]-a[0]));
    }
    return anchors[anchors.length-1][1];
  }

  // Two hundred already-existing trades fill the screen before the crash starts.
  const historyAnchors=[[0,.997],[.12,1.004],[.46,.978],[.64,.984],[.79,.992],[1,1]];
  const allTicks=[];
  let historyNoise=0,previous=START*.997;
  for(let i=0;i<VISIBLE;i++){
    const t=i/(VISIBLE-1);
    historyNoise=historyNoise*.72+(deterministic(i+31)-.5)*START*.00042;
    let price=START*levelFromAnchors(t,historyAnchors)+historyNoise*(1-t);
    if(i===VISIBLE-1)price=START;
    const move=Math.abs(price-previous);
    allTicks.push({
      ms:-(VISIBLE-1-i)*175,
      p:price,
      v:.08+deterministic(i+81)*1.1+Math.min(4,move/45000),
      up:price>=previous
    });
    previous=price;
  }

  // New trades arrive at irregular intervals. Each trade—not elapsed time—adds
  // exactly one point, removes one point on the left and recalculates all MAs.
  const crashAnchors=[
    [0,1],[.055,.998],[.145,.962],[.225,.980],
    [.355,.925],[.435,.949],[.585,.875],[.665,.902],
    [.805,.834],[.875,.853],[.955,.811],[1,.800]
  ];
  const futureTicks=[];
  let eventTime=0,crashNoise=0,eventIndex=0;
  previous=START;
  while(eventTime<DURATION){
    const gap=70+Math.floor(deterministic(eventIndex+701)*260);
    eventTime=Math.min(DURATION,eventTime+gap);
    const t=eventTime/DURATION;
    const panic=.7+1.9*Math.max(0,Math.sin((t-.04)*Math.PI*5.2));
    crashNoise=crashNoise*.73+(deterministic(eventIndex+1201)-.5)*START*.00072*panic;
    let price=START*levelFromAnchors(t,crashAnchors)+crashNoise*(1-t);
    if(eventTime===DURATION)price=TARGET;
    const move=Math.abs(price-previous);
    futureTicks.push({
      ms:eventTime,
      p:price,
      v:.1+deterministic(eventIndex+1601)*1.2+Math.min(11,move/33000)*(price<previous?1.35:.65),
      up:price>=previous
    });
    previous=price;eventIndex++;
  }

  const chart=document.getElementById('chartCanvas');
  const spark=document.getElementById('sparkCanvas');
  const ctx=chart.getContext('2d');
  const sctx=spark.getContext('2d');
  const els={
    price:document.getElementById('price'),delta:document.getElementById('delta'),
    pct:document.getElementById('pct'),high:document.getElementById('high'),
    low:document.getElementById('low'),volume:document.getElementById('volume'),
    turnover:document.getElementById('turnover'),tag:document.getElementById('priceTag'),
    note:document.getElementById('demoNote')
  };
  const startWall=Date.now();
  let startedAt=performance.now(),nextFuture=0;
  let paused=false,pauseAt=0,pauseAccum=0;
  let axisMin=0,axisMax=0,axisReady=false;

  function resizeCanvas(canvas,context){
    const r=canvas.getBoundingClientRect(),dpr=Math.min(devicePixelRatio||1,2);
    const cw=Math.max(1,Math.round(r.width*dpr)),ch=Math.max(1,Math.round(r.height*dpr));
    if(canvas.width!==cw||canvas.height!==ch){canvas.width=cw;canvas.height=ch;}
    context.setTransform(dpr,0,0,dpr,0,0);
    return {w:r.width,h:r.height};
  }

  function maAt(index,period){
    const first=Math.max(0,index-period+1);
    let sum=0;
    for(let i=first;i<=index;i++)sum+=allTicks[i].p;
    return sum/(index-first+1);
  }

  function updateAxis(visible){
    let min=Math.min(...visible.map(d=>d.p)),max=Math.max(...visible.map(d=>d.p));
    const minSpan=visible[visible.length-1].p*.028;
    if(max-min<minSpan){const mid=(max+min)/2;min=mid-minSpan/2;max=mid+minSpan/2;}
    const pad=(max-min)*.075,targetMin=min-pad,targetMax=max+pad;
    if(!axisReady){axisMin=targetMin;axisMax=targetMax;axisReady=true;return;}
    axisMin=targetMin<axisMin?targetMin:axisMin+(targetMin-axisMin)*.13;
    axisMax=targetMax>axisMax?targetMax:axisMax+(targetMax-axisMax)*.13;
  }

  function draw(){
    const visible=allTicks.slice(-VISIBLE);
    const startIndex=allTicks.length-visible.length;
    updateAxis(visible);
    const {w,h}=resizeCanvas(chart,ctx);
    ctx.clearRect(0,0,w,h);
    const top=h*.018,bottom=h*.24,plotH=h-bottom-top;
    const volTop=h*.79,volH=h*.13,left=w*.012,right=w*.155,plotW=w-left-right;
    const step=plotW/(VISIBLE-1);
    const x=i=>left+i*step;
    const y=p=>top+(axisMax-p)/(axisMax-axisMin)*plotH;

    ctx.font=`${Math.max(9,w*.0243)}px -apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR",sans-serif`;
    ctx.textAlign='left';ctx.fillStyle='#9aa3ac';
    for(let i=0;i<6;i++){
      const p=axisMax-(axisMax-axisMin)*(i/5),yy=top+plotH*(i/5);
      ctx.fillText(fmt(Math.round(p/100000)*100000),w-right+w*.016,yy+w*.008);
    }

    // Raw tick price line.
    ctx.beginPath();
    visible.forEach((d,i)=>{const xx=x(i),yy=y(d.p);i?ctx.lineTo(xx,yy):ctx.moveTo(xx,yy);});
    ctx.strokeStyle='#d9e0e7';ctx.lineWidth=1.12;ctx.lineJoin='round';ctx.lineCap='round';ctx.stroke();

    // Moving averages calculated by trade count, just like a rolling tick chart.
    const periods=[5,20,60,120],colors=['#35c76e','#ff454d','#ff8a28','#9b6df4'];
    periods.forEach((period,k)=>{
      ctx.beginPath();
      visible.forEach((d,i)=>{
        const yy=y(maAt(startIndex+i,period)),xx=x(i);
        i?ctx.lineTo(xx,yy):ctx.moveTo(xx,yy);
      });
      ctx.strokeStyle=colors[k];ctx.lineWidth=1.15;ctx.stroke();
    });

    const maxV=Math.max(...visible.map(d=>d.v),1);
    const barW=Math.max(.8,step*.72);
    visible.forEach((d,i)=>{
      const vh=d.v/maxV*volH;
      ctx.fillStyle=d.up?'rgba(49,198,106,.78)':'rgba(255,65,72,.86)';
      ctx.fillRect(x(i)-barW/2,volTop+volH-vh,barW,vh);
    });

    const last=visible[visible.length-1],ly=y(last.p);
    ctx.beginPath();ctx.arc(x(VISIBLE-1),ly,2.35,0,Math.PI*2);
    ctx.fillStyle=last.up?'#35c76e':'#ff4d54';ctx.fill();
    els.tag.style.top=(Math.max(top,Math.min(top+plotH,ly))/h*100)+'%';
    updateTimes(visible);
  }

  function updateTimes(visible){
    const first=visible[0].ms,last=visible[visible.length-1].ms;
    const timeFmt=new Intl.DateTimeFormat('ko-KR',{hour:'2-digit',minute:'2-digit',second:'2-digit',hour12:false});
    for(let i=0;i<5;i++){
      const ms=first+(last-first)*(i/4);
      document.getElementById('tickTime'+i).textContent=timeFmt.format(new Date(startWall+ms));
    }
  }

  function drawSpark(){
    const data=allTicks.slice(-70),{w,h}=resizeCanvas(spark,sctx);
    sctx.clearRect(0,0,w,h);
    const min=Math.min(...data.map(d=>d.p)),max=Math.max(...data.map(d=>d.p)),span=max-min||1;
    sctx.beginPath();
    data.forEach((d,i)=>{
      const xx=i/(data.length-1)*w,yy=3+(max-d.p)/span*(h-6);
      i?sctx.lineTo(xx,yy):sctx.moveTo(xx,yy);
    });
    sctx.strokeStyle='#ff4148';sctx.lineWidth=1.4;sctx.lineJoin='round';sctx.stroke();
  }

  function updateHeader(progress){
    const visible=allTicks.slice(-VISIBLE),last=visible[visible.length-1],price=last.p;
    els.price.textContent=fmt(price);els.tag.textContent=fmt(price);
    if(progress<.002){els.delta.textContent='-152,000';els.pct.textContent='-0.14%';}
    else{
      const delta=price-START;
      els.delta.textContent=(delta>=0?'+':'')+fmt(delta);
      els.pct.textContent=(delta/START*100).toFixed(2)+'%';
    }
    els.high.textContent=fmt(Math.max(...visible.map(d=>d.p)));
    els.low.textContent=fmt(Math.min(...visible.map(d=>d.p)));
    const volume=visible.reduce((sum,d)=>sum+d.v,0);
    els.volume.textContent=volume.toLocaleString('ko-KR',{maximumFractionDigits:2});
    els.turnover.textContent=fmt(volume*price);
  }

  function render(now){
    if(!paused){
      const elapsed=Math.min(DURATION,now-startedAt-pauseAccum);
      let changed=false;
      while(nextFuture<futureTicks.length&&futureTicks[nextFuture].ms<=elapsed){
        allTicks.push(futureTicks[nextFuture]);nextFuture++;changed=true;
      }
      if(changed){
        updateHeader(elapsed/DURATION);draw();drawSpark();
        els.note.textContent=elapsed>=DURATION?'완료 · 60초간 -20.00%':'체결 틱 '+nextFuture+' · '+Math.ceil((DURATION-elapsed)/1000)+'초';
      }
    }
    requestAnimationFrame(render);
  }

  function demoAction(label){
    const old=els.note.textContent;els.note.textContent=label+' 버튼은 시각 데모입니다';
    setTimeout(()=>{els.note.textContent=old;},1200);
  }
  document.getElementById('buyBtn').addEventListener('click',()=>demoAction('매수'));
  document.getElementById('sellBtn').addEventListener('click',()=>demoAction('매도'));
  els.price.addEventListener('click',()=>{
    paused=!paused;
    if(paused){pauseAt=performance.now();els.note.textContent='일시정지';}
    else{pauseAccum+=performance.now()-pauseAt;els.note.textContent='실시간 재개';}
  });
  window.addEventListener('resize',()=>{draw();drawSpark();});

  updateHeader(0);draw();drawSpark();requestAnimationFrame(render);
})();
</script>

<script id="tick-v1" type="application/x-disabled">
(() => {
  const root=document.getElementById('phone');
  root.dataset.ready='tick-v1';

  const START=107845000;
  const TARGET=Math.round(START*.80);
  const DURATION=60000;
  const TICK_EVERY=120;
  const TOTAL_TICKS=Math.ceil(DURATION/TICK_EVERY);
  const fmt=n=>Math.round(n).toLocaleString('ko-KR');
  const deterministic=i=>{
    const x=Math.sin(i*12.9898)*43758.5453;
    return x-Math.floor(x);
  };

  // One minute compressed panic: first break, dead-cat bounce, liquidation,
  // another bounce and a final waterfall. The final tick is exactly -20%.
  const anchors=[
    [0,1],[.055,.998],[.145,.962],[.225,.980],
    [.355,.925],[.435,.949],[.585,.875],[.665,.902],
    [.805,.834],[.875,.853],[.955,.811],[1,.800]
  ];
  function crashLevel(t){
    for(let i=1;i<anchors.length;i++){
      const a=anchors[i-1],b=anchors[i];
      if(t<=b[0]){
        const u=(t-a[0])/(b[0]-a[0]);
        const eased=u*u*(3-2*u);
        return a[1]+(b[1]-a[1])*eased;
      }
    }
    return .8;
  }

  const ticks=[];
  let noise=0,previous=START;
  for(let i=0;i<=TOTAL_TICKS;i++){
    const t=i/TOTAL_TICKS;
    const panic=.7+1.8*Math.max(0,Math.sin((t-.04)*Math.PI*5.2));
    const impulse=(deterministic(i+501)-.5)*2;
    noise=noise*.76+impulse*START*.00048*panic;
    const micro=(noise+Math.sin(i*.71)*START*.00012)*(1-t);
    let price=START*crashLevel(t)+micro;
    if(i===0) price=START;
    if(i===TOTAL_TICKS) price=TARGET;
    const move=Math.abs(price-previous);
    const volume=.08+deterministic(i+901)*.9+Math.min(9,move/38000)*(price<previous?1.45:.65);
    ticks.push({t:i*TICK_EVERY,p:price,v:volume,up:price>=previous});
    previous=price;
  }

  const chart=document.getElementById('chartCanvas');
  const spark=document.getElementById('sparkCanvas');
  const ctx=chart.getContext('2d');
  const sctx=spark.getContext('2d');
  const els={
    price:document.getElementById('price'),delta:document.getElementById('delta'),
    pct:document.getElementById('pct'),high:document.getElementById('high'),
    low:document.getElementById('low'),volume:document.getElementById('volume'),
    turnover:document.getElementById('turnover'),tag:document.getElementById('priceTag'),
    note:document.getElementById('demoNote')
  };

  let startedAt=performance.now();
  let paused=false,pauseAt=0,pauseAccum=0,lastCount=-1,currentSeries=[ticks[0]];

  function resizeCanvas(canvas,context){
    const r=canvas.getBoundingClientRect();
    const dpr=Math.min(devicePixelRatio||1,2);
    const cw=Math.max(1,Math.round(r.width*dpr));
    const ch=Math.max(1,Math.round(r.height*dpr));
    if(canvas.width!==cw||canvas.height!==ch){canvas.width=cw;canvas.height=ch;}
    context.setTransform(dpr,0,0,dpr,0,0);
    return {w:r.width,h:r.height};
  }

  function draw(series){
    const {w,h}=resizeCanvas(chart,ctx);
    ctx.clearRect(0,0,w,h);
    const top=h*.018,bottom=h*.24,plotH=h-bottom-top;
    const volTop=h*.79,volH=h*.13;
    const left=w*.012,right=w*.155,plotW=w-left-right;
    const axisMax=START*1.012,axisMin=TARGET*.982;
    const x=t=>left+(t/DURATION)*plotW;
    const y=p=>top+(axisMax-p)/(axisMax-axisMin)*plotH;

    ctx.font=`${Math.max(9,w*.0243)}px -apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR",sans-serif`;
    ctx.textAlign='left';ctx.fillStyle='#9aa3ac';
    for(let i=0;i<6;i++){
      const p=axisMax-(axisMax-axisMin)*(i/5);
      const yy=top+plotH*(i/5);
      ctx.fillText(fmt(Math.round(p/100000)*100000),w-right+w*.016,yy+w*.008);
    }

    if(series.length>1){
      ctx.beginPath();
      series.forEach((d,i)=>{const xx=x(d.t),yy=y(d.p);i?ctx.lineTo(xx,yy):ctx.moveTo(xx,yy);});
      const last=series[series.length-1];
      ctx.lineTo(x(last.t),top+plotH);
      ctx.lineTo(x(series[0].t),top+plotH);
      ctx.closePath();
      const fill=ctx.createLinearGradient(0,top,0,top+plotH);
      fill.addColorStop(0,'rgba(255,65,70,.20)');
      fill.addColorStop(1,'rgba(255,65,70,0)');
      ctx.fillStyle=fill;ctx.fill();

      ctx.beginPath();
      series.forEach((d,i)=>{const xx=x(d.t),yy=y(d.p);i?ctx.lineTo(xx,yy):ctx.moveTo(xx,yy);});
      ctx.strokeStyle='#ff4148';ctx.lineWidth=1.55;ctx.lineJoin='round';ctx.lineCap='round';ctx.stroke();
    }

    const maxV=Math.max(...ticks.map(d=>d.v),1);
    const barW=Math.max(.65,plotW/TOTAL_TICKS*.72);
    series.forEach(d=>{
      const vh=d.v/maxV*volH;
      ctx.fillStyle=d.up?'rgba(49,198,106,.78)':'rgba(255,65,72,.86)';
      ctx.fillRect(x(d.t)-barW/2,volTop+volH-vh,barW,vh);
    });

    const last=series[series.length-1];
    const lx=x(last.t),ly=y(last.p);
    ctx.beginPath();ctx.arc(lx,ly,2.5,0,Math.PI*2);
    ctx.fillStyle='#ff5a60';ctx.fill();
    els.tag.style.top=(Math.max(top,Math.min(top+plotH,ly))/h*100)+'%';
  }

  function drawSpark(series){
    const data=series.slice(-90);
    const {w,h}=resizeCanvas(spark,sctx);
    sctx.clearRect(0,0,w,h);
    if(data.length<2)return;
    const min=Math.min(...data.map(d=>d.p)),max=Math.max(...data.map(d=>d.p));
    const span=max-min||1;
    sctx.beginPath();
    data.forEach((d,i)=>{
      const xx=i/(data.length-1)*w;
      const yy=3+(max-d.p)/span*(h-6);
      i?sctx.lineTo(xx,yy):sctx.moveTo(xx,yy);
    });
    sctx.strokeStyle='#ff4148';sctx.lineWidth=1.45;sctx.lineJoin='round';sctx.stroke();
  }

  function updateHeader(series,progress){
    const last=series[series.length-1],price=last.p;
    els.price.textContent=fmt(price);els.tag.textContent=fmt(price);
    if(progress<.002){
      els.delta.textContent='-152,000';els.pct.textContent='-0.14%';
    }else{
      const delta=price-START;
      els.delta.textContent=(delta>=0?'+':'')+fmt(delta);
      els.pct.textContent=(delta/START*100).toFixed(2)+'%';
    }
    els.high.textContent=fmt(Math.max(...series.map(d=>d.p)));
    els.low.textContent=fmt(Math.min(...series.map(d=>d.p)));
    const volume=series.reduce((sum,d)=>sum+d.v,0);
    els.volume.textContent=volume.toLocaleString('ko-KR',{maximumFractionDigits:2});
    els.turnover.textContent=fmt(volume*price);
  }

  function setAxisTimes(){
    const startWall=Date.now();
    const timeFmt=new Intl.DateTimeFormat('ko-KR',{hour:'2-digit',minute:'2-digit',second:'2-digit',hour12:false});
    for(let i=0;i<5;i++){
      document.getElementById('tickTime'+i).textContent=timeFmt.format(new Date(startWall+DURATION*i/4));
    }
  }

  function render(now){
    if(!paused){
      const elapsed=Math.min(DURATION,now-startedAt-pauseAccum);
      const count=Math.min(ticks.length,Math.floor(elapsed/TICK_EVERY)+1);
      if(count!==lastCount||elapsed===DURATION){
        lastCount=count;
        currentSeries=ticks.slice(0,count);
        const progress=elapsed/DURATION;
        updateHeader(currentSeries,progress);
        draw(currentSeries);drawSpark(currentSeries);
        els.note.textContent=elapsed>=DURATION?'완료 · 60초간 -20.00%':'실시간 틱 · '+Math.ceil((DURATION-elapsed)/1000)+'초';
      }
    }
    requestAnimationFrame(render);
  }

  function demoAction(label){
    const old=els.note.textContent;
    els.note.textContent=label+' 버튼은 시각 데모입니다';
    setTimeout(()=>{els.note.textContent=old;},1200);
  }
  document.getElementById('buyBtn').addEventListener('click',()=>demoAction('매수'));
  document.getElementById('sellBtn').addEventListener('click',()=>demoAction('매도'));
  els.price.addEventListener('click',()=>{
    paused=!paused;
    if(paused){pauseAt=performance.now();els.note.textContent='일시정지';}
    else{pauseAccum+=performance.now()-pauseAt;els.note.textContent='실시간 재개';}
  });
  window.addEventListener('resize',()=>{draw(currentSeries);drawSpark(currentSeries);});

  setAxisTimes();updateHeader(currentSeries,0);draw(currentSeries);drawSpark(currentSeries);
  requestAnimationFrame(render);
})();
</script>

<script id="legacy" type="application/x-disabled">
(() => {
  const root = document.getElementById('phone');
  if (root.dataset.ready) return;
  root.dataset.ready = '1';

  const START = 107845000;
  const TARGET = Math.round(START * 0.80);
  const DURATION = 180000;
  const candleEvery = 3000;

  const fmt = n => Math.round(n).toLocaleString('ko-KR');

  // Screenshot-like initial sequence, reconstructed from the visible 1-minute chart.
  const closes = [
    107760000,107980000,108020000,107900000,107720000,107380000,107020000,106860000,
    107160000,106920000,106780000,106860000,106720000,106660000,106610000,106420000,
    106280000,106080000,105980000,105960000,105820000,105940000,105760000,105880000,
    105980000,105880000,106020000,105940000,106080000,106420000,106520000,106420000,
    106680000,106760000,106900000,106980000,107160000,107080000,107020000,107120000,
    107040000,107220000,107420000,107620000,107760000,107920000,107780000,107960000,
    108060000,107920000,108120000,107900000,107845000
  ];
  // A fixed count prevents the entire chart from changing scale whenever
  // a new live candle appears.
  const maxVisible = closes.length;

  const candles = [];
  let prev = 107700000;
  const deterministic = i => {
    const x = Math.sin(i * 12.9898) * 43758.5453;
    return x - Math.floor(x);
  };
  closes.forEach((c,i) => {
    const o = prev;
    const body = Math.max(50000, Math.abs(c-o));
    const up = 25000 + deterministic(i+2) * 120000;
    const dn = 25000 + deterministic(i+11) * 130000;
    const h = Math.max(o,c) + up;
    const l = Math.min(o,c) - dn;
    const v = 250 + deterministic(i+23) * 1200 + (body/500000)*300;
    candles.push({o,h,l,c,v});
    prev = c;
  });

  const future = [];
  let fp = START;
  const n = Math.floor(DURATION/candleEvery);
  // Fear-crash shape: hesitation, liquidation, short dead-cat bounces,
  // increasingly violent sell-offs and a final low. Ratios are relative to START.
  const crashAnchors = [
    [0.00,1.000],[0.08,.994],[0.17,.956],[0.23,.973],
    [0.36,.922],[0.43,.941],[0.57,.873],[0.64,.895],
    [0.78,.832],[0.86,.851],[0.94,.812],[1.00,.800]
  ];
  function crashLevel(t){
    for(let i=1;i<crashAnchors.length;i++){
      const a=crashAnchors[i-1], b=crashAnchors[i];
      if(t<=b[0]){
        const u=(t-a[0])/(b[0]-a[0]);
        const eased=u*u*(3-2*u);
        return a[1]+(b[1]-a[1])*eased;
      }
    }
    return .8;
  }
  for(let i=1;i<=n;i++){
    const t = i/n;
    const anchorPrice=START*crashLevel(t);
    const panic=1+1.7*Math.max(0,Math.sin((t-.08)*Math.PI*5));
    const jitter=(deterministic(i+90)-.5)*START*.0018*panic*(1-t);
    let c=anchorPrice+jitter;
    if(i===n) c = TARGET;
    const o = fp;
    const body = Math.abs(c-o);
    const falling=c<o;
    const upper=70000+deterministic(i+170)*(180000+body*.13);
    const lower=90000+deterministic(i+270)*(260000+body*(falling?.34:.20));
    const h=Math.max(o,c)+upper;
    const l=Math.min(o,c)-lower;
    const v=520+deterministic(i+350)*900+Math.min(6200,body/8500)*(falling?1.35:.72);
    future.push({o,h,l,c,v});
    fp = c;
  }

  let startedAt = performance.now();
  let added = 0;
  let paused = false;
  let pauseAt = 0;
  let pauseAccum = 0;

  const chart = document.getElementById('chartCanvas');
  const spark = document.getElementById('sparkCanvas');
  const ctx = chart.getContext('2d');
  const sctx = spark.getContext('2d');
  const els = {
    price:document.getElementById('price'),
    delta:document.getElementById('delta'),
    pct:document.getElementById('pct'),
    high:document.getElementById('high'),
    low:document.getElementById('low'),
    volume:document.getElementById('volume'),
    turnover:document.getElementById('turnover'),
    tag:document.getElementById('priceTag'),
    note:document.getElementById('demoNote')
  };

  function resizeCanvas(c, cctx){
    const r=c.getBoundingClientRect(), dpr=Math.min(devicePixelRatio||1,2);
    const w=Math.max(1,Math.round(r.width*dpr)), h=Math.max(1,Math.round(r.height*dpr));
    if(c.width!==w || c.height!==h){c.width=w;c.height=h}
    cctx.setTransform(dpr,0,0,dpr,0,0);
    return {w:r.width,h:r.height};
  }

  function ma(data, p, idx){
    const s=Math.max(0,idx-p+1); let sum=0;
    for(let j=s;j<=idx;j++) sum += data[j].c;
    return sum/(idx-s+1);
  }

  function draw(series=candles){
    const all = series.slice(-maxVisible);
    const {w,h}=resizeCanvas(chart,ctx);
    ctx.clearRect(0,0,w,h);
    const top=h*.012, bottom=h*.24, plotH=h-bottom-top, volTop=h*.78, volH=h*.14;
    const left=w*.008, right=w*.155, plotW=w-left-right;
    let min=Infinity,max=-Infinity;
    all.forEach(x=>{min=Math.min(min,x.l);max=Math.max(max,x.h)});
    const pad=(max-min)*0.08 || 1000000; min-=pad;max+=pad;
    const y=p=>top+(max-p)/(max-min)*plotH;
    const xstep=plotW/Math.max(1,all.length);
    const x=i=>left+(i+.5)*xstep;

    ctx.font=`${Math.max(9,w*.0243)}px -apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR",sans-serif`;
    ctx.textAlign='left';
    ctx.fillStyle='#9aa3ac';
    for(let i=0;i<6;i++){
      const p=max-(max-min)*(i/5);
      const yy=top+plotH*(i/5);
      ctx.fillText(fmt(Math.round(p/10000)*10000),w-right+w*.016,yy+w*.008);
    }

    const maxV=Math.max(...all.map(a=>a.v),1);
    all.forEach((d,i)=>{
      const xx=x(i), up=d.c>=d.o;
      const col=up?'#31c66a':'#ff4d4f';
      const wickTop=y(d.h),wickBot=y(d.l);
      ctx.strokeStyle=col;ctx.lineWidth=1;
      ctx.beginPath();ctx.moveTo(xx,wickTop);ctx.lineTo(xx,wickBot);ctx.stroke();
      const yo=y(d.o),yc=y(d.c), bh=Math.max(2,Math.abs(yc-yo));
      ctx.fillStyle=col;
      ctx.fillRect(xx-Math.max(2,xstep*.28),Math.min(yo,yc),Math.max(3,xstep*.56),bh);
      const vh=(d.v/maxV)*volH;
      ctx.globalAlpha=.83;
      ctx.fillRect(xx-Math.max(2,xstep*.25),volTop+volH-vh,Math.max(3,xstep*.5),vh);
      ctx.globalAlpha=1;
    });

    const periods=[5,20,60,120], cols=['#35c76e','#ff454d','#ff8a28','#9b6df4'];
    periods.forEach((p,k)=>{
      ctx.strokeStyle=cols[k];ctx.lineWidth=1.2;ctx.beginPath();
      all.forEach((d,i)=>{
        const globalIdx=Math.max(0,series.length-all.length+i);
        const m=ma(series,p,globalIdx);
        const xx=x(i),yy=y(m);
        i?ctx.lineTo(xx,yy):ctx.moveTo(xx,yy);
      });
      ctx.stroke();
    });

    const current=all[all.length-1].c;
    const py=Math.max(top,Math.min(top+plotH,y(current)));
    els.tag.style.top=(py/h*100)+'%';
  }

  function drawSpark(series=candles){
    const data=series.slice(-22).map(x=>x.c);
    const {w,h}=resizeCanvas(spark,sctx);
    sctx.clearRect(0,0,w,h);
    const mi=Math.min(...data),ma=Math.max(...data), span=ma-mi||1;
    sctx.strokeStyle='#ff4d4f';sctx.lineWidth=1.5;sctx.beginPath();
    data.forEach((p,i)=>{
      const xx=i/(data.length-1)*w;
      const yy=3+(ma-p)/span*(h-6);
      i?sctx.lineTo(xx,yy):sctx.moveTo(xx,yy);
    });
    sctx.stroke();
  }

  function updateHeader(price, progress, series=candles){
    els.price.textContent=fmt(price);
    els.tag.textContent=fmt(price);
    if(progress <= .002){
      els.delta.textContent='-152,000';
      els.pct.textContent='-0.14%';
    } else {
      const d=price-START;
      els.delta.textContent=(d>=0?'+':'')+fmt(d);
      els.pct.textContent=(d/START*100).toFixed(2)+'%';
    }
    const visible=series.slice(-maxVisible);
    els.high.textContent=fmt(Math.max(...visible.map(c=>c.h)));
    els.low.textContent=fmt(Math.min(...visible.map(c=>c.l)));
    const v=visible.slice(-20).reduce((a,c)=>a+c.v,0);
    els.volume.textContent=v.toLocaleString('ko-KR',{maximumFractionDigits:2});
    els.turnover.textContent=fmt(Math.round(v*price));
  }

  function makeLiveCandle(index, local){
    const target=future[index];
    const eased=local*local*(3-2*local);
    const phase=deterministic(index+700)*Math.PI*2;
    const body=Math.abs(target.c-target.o);
    const amp=Math.min(420000,60000+body*.16);
    // Two small intra-candle waves. sin(PI*t) makes the noise exactly zero
    // at both ends, so candle transitions remain continuous.
    const micro=Math.sin(Math.PI*local)*(
      Math.sin(local*Math.PI*4+phase)*amp*.62+
      Math.sin(local*Math.PI*9+phase*.4)*amp*.25
    );
    const c=target.o+(target.c-target.o)*eased+micro;
    const upper=target.h-Math.max(target.o,target.c);
    const lower=Math.min(target.o,target.c)-target.l;
    const wickGrowth=.18+.82*local;
    return {
      o:target.o,
      c,
      h:Math.max(target.o,c)+upper*wickGrowth,
      l:Math.min(target.o,c)-lower*wickGrowth,
      v:target.v*(.08+.92*local)
    };
  }

  function tick(now){
    if(!paused){
      const elapsed=Math.min(DURATION,now-startedAt-pauseAccum);
      const completed=Math.min(future.length,Math.floor(elapsed/candleEvery));
      while(added<completed){
        candles.push(future[added]);
        added++;
      }
      const prog=elapsed/DURATION;
      let p=TARGET;
      let liveSeries=candles;
      if(elapsed>=DURATION){
        p=TARGET;
        els.note.textContent='시뮬레이션 완료 · 시작 대비 -20.00%';
      } else {
        const idx=completed;
        const local=(elapsed%candleEvery)/candleEvery;
        const live=makeLiveCandle(idx,local);
        liveSeries=candles.concat(live);
        p=live.c;
        els.note.textContent='180초 시뮬레이션 · '+Math.ceil((DURATION-elapsed)/1000)+'초 남음';
      }
      updateHeader(p,prog,liveSeries);
      draw(liveSeries);drawSpark(liveSeries);
    }
    requestAnimationFrame(tick);
  }

  function demoAction(label){
    const old=els.note.textContent;
    els.note.textContent=label+' 버튼은 시각 데모입니다';
    setTimeout(()=>{ if(performance.now()-startedAt < DURATION) els.note.textContent=old; },1400);
  }
  document.getElementById('buyBtn').addEventListener('click',()=>demoAction('매수'));
  document.getElementById('sellBtn').addEventListener('click',()=>demoAction('매도'));

  // Tap the price to pause/resume without adding a separate UI element.
  els.price.addEventListener('click',()=>{
    paused=!paused;
    if(paused){pauseAt=performance.now();els.note.textContent='일시정지 · 가격을 다시 누르면 재개'}
    else{pauseAccum += performance.now()-pauseAt;els.note.textContent='시뮬레이션 재개'}
  });

  window.addEventListener('resize',()=>{draw();drawSpark()});
  draw();drawSpark();updateHeader(START,0);
  requestAnimationFrame(tick);
})();
</script>
